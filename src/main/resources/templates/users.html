<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Users Management</title>
    <style>
        .error { color: red; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
<h1>Users Management</h1>

<!-- Форма добавления пользователя -->
<h2>Add New User</h2>
<form th:action="@{/admin/users/add}" th:object="${user}" method="post">
    <div>
        <label>Username:</label>
        <input type="text" th:field="*{username}" required>
        <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error"></span>
    </div>

    <div>
        <label>Password:</label>
        <input type="password" th:field="*{password}" required>
        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error"></span>
    </div>

    <div>
        <label>Email:</label>
        <input type="email" th:field="*{email}" required>
        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></span>
    </div>

    <div>
        <label>Roles:</label>
        <div th:each="role : ${roles}">
            <input type="checkbox" th:value="${role.id}" name="roleIds" th:id="'role_' + ${role.id}">
            <label th:for="'role_' + ${role.id}" th:text="${role.name}">Role</label>
        </div>
    </div>

    <input type="submit" value="Add User">
</form>

<hr>

<!-- Список пользователей -->
<h2>All Users</h2>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>USERNAME</th>
        <th>EMAIL</th>
        <th>ROLES</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}">ID</td>
        <td th:text="${user.username}">username</td>
        <td th:text="${user.email}">email</td>
        <td th:text="${user.roles}">roles</td>
        <td>
            <a th:href="@{/admin/users/edit/{id}(id=${user.id})}">Edit</a> |
            <form th:action="@{/admin/users/delete/{id}(id=${user.id})}" method="post" style="display:inline;">
                <button type="submit" onclick="return confirm('Delete this user?')">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<div th:if="${#lists.isEmpty(users)}">
    <p>No users found</p>
</div>

<a href="/admin">Back to Admin Panel</a>
</body>
</html>
