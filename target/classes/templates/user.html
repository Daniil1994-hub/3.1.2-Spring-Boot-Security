<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>User Page</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 800px; margin: 0 auto; }
        .user-info { background: #f8f9fa; padding: 20px; border-radius: 5px; }
        .logout-btn {
            background: #dc3545; color: white; padding: 10px 20px;
            text-decoration: none; border-radius: 3px; display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>User Page</h1>

    <div class="user-info">
        <h2>Welcome, <span sec:authentication="name">User</span>!</h2>

        <h3>Your Information:</h3>
        <p><strong>Username:</strong> <span sec:authentication="name">username</span></p>
        <p><strong>Roles:</strong> <span sec:authentication="principal.authorities">[ROLE_USER]</span></p>

        <!-- Показываем только если пользователь ADMIN -->
        <div sec:authorize="hasRole('ADMIN')">
            <p><a href="/admin">Go to Admin Panel</a></p>
        </div>

        <div class="users_list">
            <a href="/user/list">Go to User Page</a>
        </div>
    </div>

    <!-- Форма выхода -->
    <form th:action="@{/logout}" method="post" style="display: inline;">
        <button type="submit" class="logout-btn">Logout</button>
    </form>
</div>
</body>
</html>
